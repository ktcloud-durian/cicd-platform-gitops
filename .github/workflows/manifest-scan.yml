# 매니페스트 보안 검사 (보안 기준서 SEC-01, PIP-01~04, SRV-05·06). 담당: 보안(송윤지)
# gitleaks: 비밀키·토큰 / manifest: overlay를 kustomize로 그린 뒤 Trivy로 위험한 설정 검사(root 실행, 권한 상승 등)
# main 규칙 집합(protect-main)에서 "gitleaks", "manifest"를 필수 상태 검사로 지정해야 병합이 막힘 (PIP-01)
name: Manifest Scan

on:
  pull_request:          # pull_request_target 은 쓰지 않음 (PIP-04). 필수 검사라 경로 필터 없음
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read         # 읽기만 (PIP-03)

concurrency:
  group: manifest-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA 고정, PIP-02)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (체크섬 확인)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks git --redact -v --exit-code 1 .

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy (체크섬 확인)
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy && sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Render overlays (ArgoCD가 실제로 적용하는 모양 그대로 검사)
        run: |
          set -euo pipefail
          mkdir -p rendered
          for k in apps/*/overlays/*/kustomization.yaml; do
            d=$(dirname "$k"); name=$(echo "$d" | cut -d/ -f2)-$(basename "$d")
            kubectl kustomize "$d" > "rendered/${name}.yaml"
            echo "rendered/${name}.yaml"
          done
      - name: Config scan (MEDIUM 이상이면 실패)
        # 예외는 .trivyignore.yaml 에만, 줄마다 예외 대장 번호(EX-xx)와 만료일
        run: trivy config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml rendered/
