apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      # GHCR 패키지가 private이면 04-create-pull-secret.ps1 로 만든 시크릿이 필요
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false   # 앱은 쿠버네티스 API를 쓰지 않음 (SRV-05)
      securityContext:                      # Pod Security "restricted" 기준 (SRV-04)
        runAsNonRoot: true
        runAsUser: 1000                     # node 이미지의 node 사용자
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # 실제 이미지/태그는 overlays의 kustomization.yaml(images)에서 지정
          image: app
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          # 비밀값(DB 비밀번호, 토큰 서명키)은 여기 쓰지 않고 Secret으로만 (SEC-01)
          # envFrom:
          #   - secretRef:
          #       name: sample-app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp                # 읽기 전용 루트에서 임시 파일만 허용
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
