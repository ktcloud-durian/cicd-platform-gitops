# OpenStack k3s(A): 두리안뱅크 core-api. 온프렘 ArgoCD가 이 폴더를 당겨 옴 (pull 배포)
# 배포 전에 바꿀 것 (값이 정해지기 전에는 Sync 하지 않음):
#   1) DB_HOST 10.30.40.21 → 고객 DB VM 주소 (유빈님). networkpolicy.yaml ipBlock도 같이
#   2) core-api.yaml MetalLB 주소 10.30.20.200 (동경님). overlays/aws 쪽 두 곳도 같이
#   3) images newTag → bank-release.yml이 커밋 SHA로 자동 갱신
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: durian-bank
resources:
  - namespace.yaml
  - core-api.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: bank-core-api-config
    literals:
      - DB_HOST=10.30.40.21
      - DB_USER=durian_app
      - DB_NAME=durian_bank
      - SEED_DEMO=true
images:
  - name: durian-bank-core-api
    newName: ghcr.io/ktcloud-durian/durian-bank-core-api
    newTag: e7b69fe
