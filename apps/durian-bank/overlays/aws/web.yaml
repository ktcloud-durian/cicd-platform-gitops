# web: 화면·로그인·토큰 (AWS). DB에 직접 닿지 않고 core-api(온프렘)만 부름 (DAT-04·05)
# 비밀값(SERVICE_TOKEN, JWT_SECRET)은 Secret bank-web으로만 넣음. 저장소에 값 없음 (SEC-01)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: durian-bank-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: durian-bank-web }
  template:
    metadata:
      labels: { app: durian-bank-web }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: durian-bank-web
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: bank-web-config }
            - secretRef: { name: bank-web }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app: durian-bank-web }
spec:
  type: ClusterIP
  selector: { app: durian-bank-web }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
---
# ALB(443) → 워커 NodePort 30080(Traefik) → web. 호스트 조건 없음 (ALB 헬스체크 /health가 IP로 들어옴)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
